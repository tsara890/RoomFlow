services:
  db:
    image: postgres:16
    container_name: roomflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomflow
      POSTGRES_PASSWORD: roomflow
      POSTGRES_DB: roomflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: